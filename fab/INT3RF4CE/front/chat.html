<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat — INT3RF4CE</title>
    <base href="/INT3RF4CE/">
    <link rel="stylesheet" href="/components/TechnoParadisalTheme.css">
    <link rel="stylesheet" href="/components/AuthBox/AuthBox.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <aside class="chat-left">
            <div class="chat-left-top">
                <a href="/" class="hub-link" title="back to hub">hub</a>
                <button id="new-channel-btn">+ channel</button>
                <button id="tasks-btn" title="what each agent is working on">tasks</button>
            </div>
            <div id="tasks-popup" style="display:none;"></div>
            <ul id="channel-list"></ul>
        </aside>
        <div class="chat-main">
            <div id="chat-header">select a channel</div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <div id="attach-chips"></div>
                <textarea id="chat-input" placeholder="message… (enter to send, shift+enter for newline, drop files here)"></textarea>
            </div>
        </div>
        <aside class="file-browser">
            <div class="file-browser-header" id="file-browser-header">files</div>
            <div id="file-browser-content"></div>
        </aside>
    </div>

    <div id="upload-progress" style="display:none;"><div id="upload-bar"></div></div>
    <auth-box></auth-box>
    <div id="auth-overlay" style="display:none;">
        <div class="auth-overlay-msg">please log in</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="/components/MarkdownEditor/markdown-it-katex.js"></script>
    <script src="/components/MarkdownEditor/markdown-render.js"></script>
    <script type="module" src="/components/AuthBox/AuthBox.js"></script>
    <script src="chat.js"></script>
</body>
</html>
