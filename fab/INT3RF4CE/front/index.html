<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INT3RF4CE</title>
    <base href="/INT3RF4CE/">
    <link rel="stylesheet" href="/components/TechnoParadisalTheme.css">
    <link rel="stylesheet" href="/components/AuthBox/AuthBox.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
    <div class="container">
        <!-- Left -->
        <aside class="left-panel">
            <div class="left-top">
                <div class="agent-controls">
                    <input type="text" id="new-agent-name" placeholder="agent name">
                    <button id="create-btn">create</button>
                    <a href="/INT3RF4CE/chat/" class="hub-link" title="chat view">chat</a>
                    <a href="/" class="hub-link" title="back to hub">hub</a>
                </div>
            </div>
            <div class="left-bottom">
                <ul id="agent-list"></ul>
            </div>
        </aside>

        <!-- Middle: 50% -->
        <div class="mid-panel">
            <div class="mid-mid">
                <div id="vnc-placeholder">select an agent to view</div>
                <iframe id="vnc-frame" style="display:none;"></iframe>
            </div>
            <div class="mid-bot">
                <button id="docker-btn" disabled title="docker">▶ docker</button>
                <button id="model-btn" disabled title="model">▶ model</button>
                <button id="settings-btn">settings</button>
                <button id="chat-mode-btn" title="single-turn mode: one reply per message, no work loop">single turn</button>
            </div>
        </div>

        <!-- Right: 40% -->
        <div class="right-panel">
            <div id="context-messages"></div>
            <div id="status-bar" style="display:none;">generating...</div>
            <div class="right-bot">
                <div id="attach-chips"></div>
                <select id="model-select">
                    <option value="kimi-k3">kimi-k3</option>
                    <option value="kimi-k2.7-fast">kimi-k2.7-fast</option>
                </select>
                <textarea id="chat-input" placeholder="shift+enter to send, enter for newline"></textarea>
            </div>
        </div>
    </div>

    <!-- Agent action popup -->
    <div id="agent-menu" style="display:none;">
        <button id="agent-menu-rename">rename</button>
        <button id="agent-menu-delete">delete</button>
    </div>

    <auth-box></auth-box>

    <!-- full-page gate shown when logged out -->
    <div id="auth-overlay" style="display:none;">
        <div class="auth-overlay-msg">please log in — top right</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="/components/MarkdownEditor/markdown-it-katex.js"></script>
    <script src="/components/MarkdownEditor/markdown-render.js"></script>
    <script type="module" src="/components/AuthBox/AuthBox.js?v=2"></script>
    <script src="app.js?v=15"></script>
</body>
</html>
