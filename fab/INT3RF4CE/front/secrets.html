<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secrets — INT3RF4CE</title>
    <base href="/INT3RF4CE/">
    <link rel="stylesheet" href="/components/TechnoParadisalTheme.css">
    <link rel="stylesheet" href="/components/AuthBox/AuthBox.css?v=2">
    <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
    <div class="chat-container">
        <aside class="chat-left">
            <div class="chat-left-top">
                <a href="/INT3RF4CE/" class="hub-link" title="agent view">agents</a>
                <a href="/INT3RF4CE/chat/" class="hub-link" title="chat view">chat</a>
            </div>
        </aside>
        <div class="chat-main">
            <div id="chat-header">secrets</div>
            <div id="secrets-list">
                <div class="secrets-cat">llm apis</div>
                <div id="cat-llm"></div>
                <div class="secrets-add-row">
                    <select id="new-llm-name">
                        <option value="moonshot">moonshot</option>
                        <option value="deepseek">deepseek</option>
                    </select>
                    <input id="new-llm-value" placeholder="api key" spellcheck="false">
                    <button data-cat="llm" class="add-secret-btn">add</button>
                </div>
                <div class="secrets-cat">git</div>
                <div class="secrets-sub">keys — github account + ssh private key pairs</div>
                <div id="cat-git"></div>
                <div class="secrets-add-row git-add-row">
                    <input id="new-git-name" placeholder="name (e.g. agent-main)" spellcheck="false">
                    <input id="new-git-account" placeholder="github account" spellcheck="false">
                    <textarea id="new-git-key" placeholder="ssh private key (multi-line paste ok)" spellcheck="false"></textarea>
                    <button data-cat="git" class="add-secret-btn">add</button>
                </div>
                <div class="secrets-sub">repos (not secret — just kept with git)</div>
                <div id="cat-gitrepo"></div>
                <div class="secrets-add-row">
                    <input id="new-gitrepo-name" placeholder="label (e.g. mindfab)" spellcheck="false">
                    <input id="new-gitrepo-value" placeholder="git@github.com:you/repo.git" spellcheck="false">
                    <button data-cat="gitrepo" class="add-secret-btn">add</button>
                </div>
                <div class="secrets-cat">compute rent</div>
                <div id="cat-computerent"></div>
                <div class="secrets-add-row">
                    <select id="new-computerent-name">
                        <option value="autodl">autodl</option>
                    </select>
                    <input id="new-computerent-value" placeholder="api key" spellcheck="false">
                    <button data-cat="computerent" class="add-secret-btn">add</button>
                </div>
                <div class="secrets-cat">compute ssh</div>
                <div id="cat-compute"></div>
                <div class="secrets-add-row">
                    <input id="new-compute-name" placeholder="name (e.g. home desktop)" spellcheck="false">
                    <input id="new-compute-value" placeholder="value" spellcheck="false">
                    <button data-cat="compute" class="add-secret-btn">add</button>
                </div>
                <div class="secrets-cat">accounts</div>
                <div id="cat-account"></div>
                <div class="secrets-add-row">
                    <input id="new-account-name" placeholder="name (e.g. google)" spellcheck="false">
                    <input id="new-account-value" placeholder="value" spellcheck="false">
                    <button data-cat="account" class="add-secret-btn">add</button>
                </div>
            </div>
        </div>
    </div>

    <auth-box></auth-box>
    <div id="auth-overlay" style="display:none;">
        <div class="auth-overlay-msg">please log in</div>
    </div>

    <script type="module" src="/components/AuthBox/AuthBox.js?v=2"></script>
    <script src="secrets.js?v=5"></script>
</body>
</html>
