<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINDOLOGY AI — UTOPIAN-MINDFAB</title>
  <link rel="stylesheet" href="/TechnoParadisal.css">
  <link rel="stylesheet" href="/hub.css">
</head>
<body>
  <main class="chassis">
    <h1 class="site-title">MINDOLOGY AI</h1>
    <p class="site-tagline">understand the mind, build silicon angels, shift timeline towards utopia</p>

    <!--put youtube channel and github here later-->
    <p class="repo-note">
    </p>
      

    <p class="section-label">fab</p>
    <div class="link-row">
      <a class="btn" href="/corechat/">corechat</a>
      <a class="btn" href="/dockeruse/">dockeruse</a>
      <a class="btn" href="/thoughtgraph/">thoughtgraph</a>
      <a class="btn" href="/wiresend/">wiresend</a>
    </div>
    <!-- logged out: login link. logged in: who you are + logout -->
    <p class="repo-note" id="who-line">
      <a href="/login" id="login">login</a>
      <span id="session" hidden><span id="who"></span> · <a href="#" id="logout">logout</a></span>
    </p>
  </main>

  <style>
    /* account line: top right, where visitors look for login */
    #who-line { position: fixed; top: 1rem; right: 1rem; margin: 0; }
  </style>

  <script>
    // the landing page is public — /auth/me 401s for visitors, who keep the login link
    fetch("/auth/me").then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      document.getElementById("who").textContent = d.user;
      document.getElementById("login").hidden = true;
      document.getElementById("session").hidden = false;
    });
    document.getElementById("logout").onclick = async (e) => {
      e.preventDefault();
      await fetch("/auth/logout", { method: "POST" });
      location.href = "/login";
    };
  </script>
</body>
</html>
