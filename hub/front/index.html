<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINDOLOGY AI — UTOPIAN-MINDFAB</title>
  <link rel="stylesheet" href="/TechnoParadisal.css">
  <link rel="stylesheet" href="/hub.css">
</head>
<body>
  <main class="chassis">
    <h1 class="site-title">MINDOLOGY AI</h1>
    <p class="site-tagline">understand the mind, build silicon angels, shift timeline towards utopia</p>

    <p class="repo-note">
      all code here (for now):
      <a href="https://github.com/MINDOLOGY-AI/UTOPIAN-MINDFAB">https://github.com/MINDOLOGY-AI/UTOPIAN-MINDFAB</a><br>
      youtube channel:
      <a href="https://www.youtube.com/">https://www.youtube.com/</a>
    </p>

    <p class="section-label">fab</p>
    <div class="link-row">
      <a class="btn" href="/corechat/">corechat</a>
      <a class="btn" href="/dockeruse/">dockeruse</a>
      <a class="btn" href="/thoughtgraph/">thoughtgraph</a>
      <a class="btn" href="/wiresend/">wiresend</a>
    </div>
    <p class="repo-note" id="who-line"><span id="who"></span> · <a href="#" id="logout">logout</a></p>
  </main>

  <style>
    /* who you are + logout: bottom right, out of the way */
    #who-line { position: fixed; bottom: 1rem; right: 1rem; margin: 0; }
  </style>

  <script>
    fetch("/auth/me").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      document.getElementById("who").textContent = d.user;
    });
    document.getElementById("logout").onclick = async (e) => {
      e.preventDefault();
      await fetch("/auth/logout", { method: "POST" });
      location.href = "/login";
    };
  </script>
</body>
</html>
