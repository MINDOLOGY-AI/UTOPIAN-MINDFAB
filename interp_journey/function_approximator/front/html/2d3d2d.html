<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2d to 3d to 2d</title>
  <link rel="stylesheet" href="/components/TechnoParadisalTheme.css">
  <link rel="stylesheet" href="/components/TechnoParadisalComponents.css">
  <link rel="stylesheet" href="/components/VectorEditor/VectorEditor.css">
  <link rel="stylesheet" href="/interp_journey/function_approximator/front/css/index.css">
</head>
<body>
  <div class="page-nav">
    <cyber-home></cyber-home>
    <cyber-back></cyber-back>
  </div>
  <h1 style="color: var(--lavender); font-family: 'Space Grotesk', sans-serif; margin: 1rem;">2d to 3d to 2d</h1>

  <div class="workspace">
    <div class="row">
      <div class="panel">
        <h2>input vectors</h2>
        <vector-editor id="input-editor" width="300" height="300" range="3"></vector-editor>
      </div>

      <div class="panel">
        <h2>output vectors</h2>
        <vector-editor id="output-editor" width="300" height="300" range="3"></vector-editor>
      </div>
    </div>

    <div class="row">
      <div class="panel">
        <h2>pairs</h2>
        <div class="pair-controls">
          <button id="add-pair">add pair</button>
          <button id="clear-pairs">clear pairs</button>
        </div>
        <ul id="pair-list"></ul>
      </div>

      <div class="panel">
        <h2>train</h2>
        <div id="training-panel"></div>
      </div>
    </div>

    <div class="panel">
      <h2>inference</h2>
      <div class="infer-row">
        <vector-editor id="infer-input" width="300" height="300" range="3"></vector-editor>
        <button id="infer-btn">infer</button>
        <vector-editor id="infer-output" width="300" height="300" range="3" writable="false"></vector-editor>
      </div>
    </div>

    <div class="row">
      <div class="panel">
        <h2>encoder rows</h2>
        <vector-editor id="encoder-editor" width="300" height="300" range="3" writable="true"></vector-editor>
        <div class="bias-row" id="encoder-biases"></div>
      </div>

      <div class="panel">
        <h2>decoder columns</h2>
        <vector-editor id="decoder-editor" width="300" height="300" range="3" writable="true"></vector-editor>
        <div class="bias-row" id="decoder-biases"></div>
      </div>
    </div>

    <div class="panel">
      <h2>space shift</h2>
      <canvas id="space-shift-canvas" width="300" height="300"></canvas>
    </div>
  </div>

  <script type="module" src="/components/TechnoParadisalComponents.js"></script>
  <script type="module" src="/components/VectorEditor/VectorEditor.js"></script>
  <script type="module" src="/interp_journey/function_approximator/front/js/2d3d2d.js"></script>
</body>
</html>
