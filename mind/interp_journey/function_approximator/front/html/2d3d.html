<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2d to 3d</title>
  <link rel="stylesheet" href="/components/TechnoParadisalTheme.css">
  <link rel="stylesheet" href="/components/TechnoParadisalComponents.css">
  <link rel="stylesheet" href="/components/2dDraw/FreeDrawCanvas.css">
  <link rel="stylesheet" href="/components/Surface3D/Surface3D.css">
  <link rel="stylesheet" href="/interp_journey/function_approximator/front/css/index.css">
</head>
<body>
  <div class="page-nav">
    <cyber-home></cyber-home>
    <cyber-back></cyber-back>
  </div>
  <h1 style="color: var(--lavender); font-family: 'Space Grotesk', sans-serif; margin: 1rem;">2d to 3d</h1>

  <div class="workspace">
    <div class="panel">
      <h2>target</h2>
      <free-draw-canvas id="target-canvas" width="300" cols="30" rows="30" endpoint="/api/drawing"></free-draw-canvas>
    </div>

    <div class="panel">
      <h2>train</h2>
      <div id="training-panel"></div>
    </div>

    <div class="panel">
      <h2>prediction</h2>
      <free-draw-canvas id="prediction-canvas" width="300" cols="30" rows="30" writable="false"></free-draw-canvas>
    </div>

    <div class="panel full-width">
      <h2>neuron hyperplanes</h2>
      <div id="hyperplane-plots"></div>
    </div>
  </div>

  <script type="module" src="/components/TechnoParadisalComponents.js"></script>
  <script type="module" src="/components/2dDraw/FreeDrawCanvas.js"></script>
  <script type="module" src="/components/Surface3D/Surface3D.js"></script>
  <script type="module" src="/interp_journey/function_approximator/front/js/2d3d.js"></script>
</body>
</html>
